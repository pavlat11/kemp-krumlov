<script>/* spravovaný web: Kemp Krumlov | PE-LA (přepínač v menu, ?web=pela z editačního režimu PE-LA) */
(function(){try{var q=(location.search.match(/[?&]web=(kemp|pela)/)||[])[1];if(q){localStorage.setItem('kkt.admin-web',JSON.stringify(q));history.replaceState(null,'',location.pathname+location.hash)}
var w=JSON.parse(localStorage.getItem('kkt.admin-web')||'"kemp"');window.KK_WEB=w==='pela'?'pela':'kemp'}catch(e){window.KK_WEB='kemp'}
document.documentElement.classList.add('w-'+window.KK_WEB);if(window.KK_WEB==='pela'){document.title='Administrace · PE-LA';var m=document.querySelector('meta[name=theme-color]');if(m)m.content='#0a2229'}})();</script>
