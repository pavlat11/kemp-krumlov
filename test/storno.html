<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zrušení rezervace · Kemp Krumlov</title>
<meta name="theme-color" content="#0f2219">
<meta name="robots" content="noindex, nofollow">
<style>
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--deep:#0f2219;--forest:#173a29;--river:#2a7c86;--cream:#faf6ee;--sand:#f3ecdf;--sun:#f4a64a;--ink:#14201a;--muted:#5e6b63;--line:rgba(20,32,26,.1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
a{color:var(--river);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.hd{background:var(--deep);color:#fff}
.hd-in{max-width:880px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;color:#fff;text-decoration:none}.logo svg{height:40px;width:auto}
.sp{flex:1}
.lang{display:flex;gap:6px}
.lang button{font:inherit;font-size:14px;font-weight:700;color:#cfe0d6;background:transparent;border:1.5px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--deep);border-color:#fff}
.zpet{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1)}
.zpet:hover{background:rgba(255,255,255,.18)}
main{max-width:880px;margin:0 auto;padding:44px 24px 72px}
.eyebrow{display:inline-block;font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--river);margin-bottom:10px}
h1{font-size:clamp(32px,5vw,46px);line-height:1.12;letter-spacing:-.02em;margin:0 0 14px;color:var(--deep)}
.lead{font-size:18.5px;color:var(--muted);margin:0 0 30px}
@media(max-width:640px){.toc ol{columns:1}}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:0}
@media(max-width:560px){.hd-in{gap:10px;padding:14px 16px}.logo svg{height:30px}.zpet{padding:8px 11px}.zpet span[data-l]{display:none!important}.lang button{padding:5px 9px}main{padding:32px 16px 56px}section{padding:20px 18px}}
.ft{max-width:880px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:14px}

h1+.box{margin-top:22px}
.box{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px 28px;margin-bottom:18px}
.rz{display:grid;grid-template-columns:max-content 1fr;gap:8px 22px;margin:0}
.rz dt{color:var(--muted);font-weight:600}.rz dd{margin:0;font-weight:700}
.pod{background:var(--sand);border-radius:16px;padding:16px 18px;font-size:15.5px;color:var(--forest);margin:0 0 22px;white-space:pre-line}
.pod b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:normal}
label.f{display:block;font-weight:700;margin:0 0 8px;color:var(--deep)}
label.f small{display:block;font-weight:500;color:var(--muted);font-size:14.5px}
.inp{width:100%;font:inherit;font-size:17px;padding:13px 16px;border:1.5px solid rgba(20,32,26,.2);border-radius:14px;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--river);box-shadow:0 0 0 4px rgba(42,124,134,.15)}
#potv{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:20px;text-align:center;max-width:320px}
textarea.inp{min-height:84px;resize:vertical}
.pole{margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:800;font-size:16.5px;padding:15px 26px;border-radius:999px;border:0;cursor:pointer;text-decoration:none}
.btn-z{background:#c2412d;color:#fff;box-shadow:0 10px 24px -12px rgba(194,65,45,.8)}
.btn-z:disabled{background:#d9d2c4;color:#8a8473;box-shadow:none;cursor:not-allowed}
.btn-g{background:var(--sand);color:var(--deep)}
.akce{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.ok{font-size:14.5px;color:var(--muted);margin-top:10px;min-height:1.4em}
.stav{display:flex;gap:16px;align-items:flex-start}
.stav i{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:800}
.stav.zr i{background:#e3f1f2;color:#1f6d77}.stav.ne i{background:#fdf0de;color:#9a5a0c}
.stav h2{margin:0 0 6px;font-size:22px;color:var(--deep)}.stav p{margin:0 0 6px;color:var(--muted)}
@media(max-width:560px){.box{padding:20px 18px}.rz{grid-template-columns:1fr;gap:2px}.rz dd{margin-bottom:8px}.btn{width:100%}}
[data-l]{display:none}
html[lang="cs"] [data-l="cs"],html[lang="en"] [data-l="en"],html[lang="de"] [data-l="de"]{display:inline}
</style>
<script>
(function(){var J=['cs','en','de'],q=(location.search.match(/[?&]lang=([a-z]{2})/)||[])[1],s=null;try{s=JSON.parse(localStorage.getItem('kkt.jazyk')||'null')}catch(e){}
var l=J.indexOf(q)>=0?q:J.indexOf(s)>=0?s:'cs';document.documentElement.lang=l})();
</script>
</head>

</div></header>
