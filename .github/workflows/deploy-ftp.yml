# Kemp Krumlov – automatické nahrání webu na hosting přes FTP.
# Spustí se po každém pushi do větve main, nebo ručně (Actions → Deploy na FTP → Run workflow).
#
# Potřebné údaje (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#   FTP_SERVER      adresa FTP serveru, např. ftp.kemp-krumlov.cz
#   FTP_USERNAME    přihlašovací jméno
#   FTP_PASSWORD    heslo
#   FTP_SERVER_DIR  (nepovinné) složka webu na serveru, MUSÍ končit lomítkem, např. www/ nebo public_html/
#                   když chybí, nahrává se do kořene FTP účtu (./)
#
# Nahrávají se jen změněné soubory (stav si akce drží v souboru .ftp-deploy-sync-state.json na serveru).
# Soubory, které na serveru vznikly jinak (např. .env, nahrané fotky), se nemažou.

name: Deploy na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nahrát na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/*.md
            .env.example
            nastroje/**
            prototyp/**
            _nahled/**
